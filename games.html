<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweaker Games - Games</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<video autoplay muted loop id="bg-video">
  <source src="videos/galaxy.mp4" type="video/mp4">
</video>

<nav class="navbar">
  <div class="nav-left">
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="feedback.html">Feedback</a>
    <a href="chat.html">Chat</a>
  </div>
</nav>

<header>
  <h1>Games</h1>
</header>

<div class="game-grid">
  <!-- Example Game Card -->
  <div class="game-card" onclick="openGame('game1.html')">
    <img src="icons/game1.png" alt="Game 1">
    <span>Game 1</span>
  </div>
  <div class="game-card" onclick="openGame('game2.html')">
    <img src="icons/game2.png" alt="Game 2">
    <span>Game 2</span>
  </div>
  <!-- Add more games here -->
</div>

<!-- Game overlay -->
<div id="gameOverlay" class="game-overlay">
  <div class="overlay-content">
    <iframe id="gameFrame" src="" frameborder="0"></iframe>
    <div class="game-sidebar">
      <h3>Leaderboard</h3>
      <ul id="leaderboard"></ul>
      <button onclick="toggleFullscreen()">Full Screen</button>
      <button onclick="closeGame()">Close</button>
    </div>
  </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
