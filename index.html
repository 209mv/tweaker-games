<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tweaker Games</title>
  <link rel="stylesheet" href="styles.css">
  <script src="ruffle.js"></script> <!-- For SWF games -->
</head>
<body>

  <!-- Navbar -->
  <nav>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#games">Games</a></li>
      <li><a href="#feedback">Feedback</a></li>
    </ul>
  </nav>

  <!-- Galaxy Video Background -->
  <video autoplay muted loop id="bg-video">
    <source src="assets/galaxy.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Hero Section -->
  <section id="home">
    <div class="overlay"></div>
    <div class="content">
      <h1>Welcome to Tweaker Games</h1>
      <p>Play HTML5 & SWF games online!</p>
    </div>
  </section>

  <!-- Games Section -->
  <section id="games">
    <div class="overlay"></div>
    <h2>Games</h2>
    <div class="game-grid">
      <div class="game-card">
        <h3>Game 1</h3>
        <iframe src="games/game1.html"></iframe>
      </div>
      <div class="game-card">
        <h3>Game 2</h3>
        <iframe src="games/game2.html"></iframe>
      </div>
    </div>
  </section>

  <!-- Feedback Section -->
  <section id="feedback">
    <div class="overlay"></div>
    <h2>Send us your ideas</h2>
    <form>
      <input type="text" placeholder="Your username" required>
      <textarea placeholder="Your feedback" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Tweaker Games</p>
  </footer>

</body>
</html>
