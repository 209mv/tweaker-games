<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweaker Games</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Background -->
<video autoplay muted loop id="bg-video">
  <source src="videos/galaxy.mp4" type="video/mp4">
</video>

<!-- Navigation -->
<nav class="navbar">
  <div class="nav-left">
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="feedback.html">Feedback</a>
    <a href="chat.html">Chat</a>
  </div>
  <div class="nav-right">
    <button id="accountBtn">Account</button>
  </div>
</nav>

<!-- Header -->
<header>
  <h1>Welcome to Tweaker Games</h1>
</header>

<!-- Account Modal -->
<div id="accountModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Account</h2>
    <input type="text" placeholder="Username" class="bubble-input">
    <input type="password" placeholder="Password" class="bubble-input">
    <div class="bubble-buttons">
      <button>Login</button>
      <button>Register</button>
    </div>
  </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
